<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devlingo — learn to code, 5 minutes at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;
 --red:#ff4b4b;--red-d:#ea2b2b;--gold:#ffc800;--gold-d:#e0a500;--purple:#ce82ff;
 --ink:#3c3c3c;--gray:#777;--line:#e5e5e5;--soft:#f7f7f7;--card:#fff;
}
html{scroll-behavior:smooth}
body{font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:var(--ink);font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button{font-family:inherit}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--line)}
.tb-in{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{font-weight:900;font-size:22px;color:var(--green);letter-spacing:-.5px;display:flex;align-items:center;gap:6px;user-select:none}
.brand .owl{width:28px;height:28px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.icon{display:inline-block;vertical-align:-.16em;flex:none;stroke:currentColor}
.stats{display:flex;gap:14px;font-weight:800;font-size:15px}
.stat{display:flex;align-items:center;gap:4px;color:var(--gold)}
.stat:first-child{color:var(--gold)} .stat.fire{color:#ff9600} .stat.hp{color:var(--red)}
/* ---------- tabs ---------- */
.tabs{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:58px;z-index:40}
.tabs-in{display:flex}
.tab{flex:1;background:none;border:none;border-bottom:4px solid transparent;padding:10px 4px 8px;font-weight:800;font-size:12.5px;color:var(--gray);cursor:pointer;letter-spacing:.4px;text-transform:uppercase}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
/* ---------- buttons ---------- */
.btn{border:none;border-radius:14px;padding:13px 26px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;font-size:14px;cursor:pointer;transition:transform .06s,box-shadow .06s,filter .15s;box-shadow:0 4px 0 var(--sh,#46a302)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--sh)}
.btn:disabled{filter:grayscale(.6);opacity:.55;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff;--sh:var(--green-d)}
.btn-blue{background:var(--blue);color:#fff;--sh:var(--blue-d)}
.btn-red{background:var(--red);color:#fff;--sh:var(--red-d)}
.btn-gold{background:var(--gold);color:#7a5b00;--sh:var(--gold-d)}
.btn-ghost{background:var(--soft);color:var(--gray);--sh:#dcdcdc}
.btn-big{width:100%;padding:16px;font-size:16px}
/* ---------- home ---------- */
.greet{display:flex;align-items:center;gap:16px;padding:20px 4px 6px}
.greet h1{font-size:24px;font-weight:900}
.greet p{color:var(--gray);font-size:14px;font-weight:700}
.ringbox{margin-left:auto;position:relative;width:74px;height:74px;flex:none}
.ringbox svg{transform:rotate(-90deg)}
.ringbox .rtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--gold)}
.ringbox .rtxt small{font-size:9px;color:var(--gray);letter-spacing:.5px}
/* ---------- units / tree ---------- */
.unit{border:2px solid var(--line);border-radius:18px;overflow:hidden;margin:18px 0;background:var(--card)}
.unit-head{padding:14px 16px;display:flex;align-items:center;gap:12px;color:#fff}
.unit-head .uic{font-size:28px}
.unit-head h2{font-size:17px;font-weight:900;letter-spacing:.3px}
.unit-head .prog{margin-left:auto;font-weight:800;font-size:13px;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:20px}
.unit-body{padding:26px 14px 30px;display:flex;flex-direction:column;gap:22px;background:radial-gradient(circle at 50% 0,#fff 60%,var(--soft))}
.node-row{display:flex;width:100%}
.node-row.r0{justify-content:center}
.node-row.r1{justify-content:flex-start;padding-left:11%}
.node-row.r2{justify-content:flex-end;padding-right:11%}
.nodecell{display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:74px;height:74px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.16);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.node .sub{position:absolute;bottom:-8px;background:var(--gold);border-radius:20px;font-size:11px;font-weight:900;color:#7a5b00;padding:2px 8px;border:2px solid #fff}
.node.locked{background:#e5e5e5;cursor:not-allowed;box-shadow:0 6px 0 #cfcfcf}
.node.locked:active{transform:none;box-shadow:0 6px 0 #cfcfcf}
.node.open{background:var(--uc,#58cc02);color:#fff}
.node.done{background:var(--gold);color:#fff}
.node.perfect{outline:4px solid var(--purple);outline-offset:3px}
.node.bounce{animation:bounce 1.8s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.node-label{font-size:12px;font-weight:800;color:var(--gray);text-align:center;max-width:110px;line-height:1.2}
/* ---------- lesson ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;padding:14px 4px}
.xbtn{background:none;border:none;font-size:20px;color:var(--gray);cursor:pointer;font-weight:900;padding:4px 8px}
.ptrack{flex:1;height:16px;background:var(--line);border-radius:20px;overflow:hidden}
.pfill{height:100%;background:var(--green);border-radius:20px;transition:width .35s ease}
.lhearts{font-weight:900;color:var(--red);white-space:nowrap}
.excard{padding:8px 4px 20px}
.extype{display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:900;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;margin:10px 0 12px}
.prompt{font-size:20px;font-weight:800;line-height:1.45;margin-bottom:16px}
.code{background:#263238;color:#e8f0f2;border-radius:14px;padding:16px;font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;font-size:14px;line-height:1.6;white-space:pre;overflow-x:auto;margin-bottom:18px;border:1px solid #1c272b}
.code .blank{background:var(--gold);color:#5c4300;border-radius:6px;padding:1px 10px;font-weight:700}
.code .ln{color:#5f7a83;user-select:none;display:inline-block;width:2ch;margin-right:12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);border-radius:14px;background:#fff;padding:15px 16px;font-weight:800;font-size:15.5px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink);transition:border-color .12s,background .12s,transform .12s}
.opt:hover{border-color:#cfcfcf}
.opt .k{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gray);flex:none;font-weight:900}
.opt.sel{border-color:var(--blue);background:#ddf4ff}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:#d7ffb8}
.opt.right .k{border-color:var(--green);background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#ffdfe0}
.opt.wrong .k{border-color:var(--red);background:var(--red);color:#fff}
.opt code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:var(--soft);padding:2px 7px;border-radius:6px}
textarea.editor{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;padding:14px;font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;font-size:14px;line-height:1.6;resize:vertical;background:#fbfdff;color:var(--ink);outline:none}
textarea.editor:focus{border-color:var(--blue)}
.runout{border-radius:14px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;white-space:pre-wrap;margin-top:10px;border:2px solid var(--line);background:var(--soft)}
.runout.err{border-color:var(--red);background:#fff3f3;color:var(--red)}
.runout.okl{border-color:var(--green);background:#f4ffe9}
.lesson-foot{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--line);padding:14px 0 18px;margin-top:8px}
.feedback{border-radius:16px;padding:16px;margin-bottom:14px;display:none;animation:up .25s ease}
.feedback.show{display:block}
.feedback.good{background:#d7ffb8;border:2px solid var(--green)}
.feedback.bad{background:#ffdfe0;border:2px solid var(--red)}
.feedback h3{font-size:19px;font-weight:900;margin-bottom:4px}
.feedback.good h3{color:#4e9a06}
.feedback.bad h3{color:var(--red)}
.feedback p{font-size:14.5px;font-weight:700;color:#4b4b4b;line-height:1.5}
.feedback .fa{margin-top:8px;font-weight:800;color:#345}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
/* ---------- sheets / overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,24,28,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:#fff;border-radius:22px;max-width:420px;width:100%;padding:28px 24px;text-align:center;animation:up .22s ease;max-height:88vh;overflow:auto}
.sheet .mascot{width:58px;height:58px;display:block;margin:0 auto 6px}
.sheet h2{font-size:23px;font-weight:900;margin-bottom:4px}
.sheet .un{color:var(--gray);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.sheet .tipbox{background:#ddf4ff;border:2px solid #84d8ff;border-radius:14px;padding:14px;margin:16px 0;font-size:14.5px;font-weight:700;text-align:left;line-height:1.55}
.sheet .tipbox b{color:var(--blue-d)}
.sheet .meta{color:var(--gray);font-weight:800;font-size:13.5px;margin-bottom:16px}
/* ---------- end / fail ---------- */
.endcard{text-align:center;padding:36px 20px}
.endcard .bigowl{width:76px;height:76px;animation:bounce 1.6s infinite;display:inline-block}
.endcard h2{font-size:26px;font-weight:900;margin:8px 0 4px}
.endcard .sub{color:var(--gray);font-weight:800;margin-bottom:20px}
.xpbar{display:inline-flex;align-items:center;gap:8px;background:#fff7d6;border:2px solid var(--gold);color:#a97e00;font-weight:900;font-size:20px;border-radius:40px;padding:8px 22px;margin-bottom:20px}
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;text-align:left}
.row{display:flex;justify-content:space-between;background:var(--soft);border-radius:12px;padding:11px 16px;font-weight:800;font-size:14.5px}
.row span:last-child{color:var(--green)}
.flaw{background:linear-gradient(135deg,#f3d1ff,#e3c8ff);border:2px solid var(--purple);border-radius:14px;padding:10px;font-weight:900;color:#7b2fd6;margin-bottom:18px;letter-spacing:.5px}
/* ---------- achievements ---------- */
.achgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 0}
.ach{border:2px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;background:#fff}
.ach .ic{width:40px;height:40px;margin:0 auto}
.ach h4{font-size:14px;font-weight:900;margin:6px 0 2px}
.ach p{font-size:12px;color:var(--gray);font-weight:700;line-height:1.35}
.ach.locked{filter:grayscale(1);opacity:.55;background:var(--soft)}
.sechead{padding:20px 4px 0;font-size:20px;font-weight:900}
.secsub{padding:2px 4px;color:var(--gray);font-weight:700;font-size:14px}
/* ---------- profile ---------- */
.pcard{margin:18px 0;border:2px solid var(--line);border-radius:20px;padding:22px;text-align:center;background:linear-gradient(180deg,#fff,#fdfdfd)}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;border:4px solid #d7ffb8;color:#fff}
.avatar .icon{width:52px;height:52px}
.pcard h2{font-size:24px;font-weight:900}
.lvl{color:var(--gold);font-weight:900;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.lvlbar{height:14px;background:var(--line);border-radius:20px;overflow:hidden;margin:10px 24px 4px}
.lvlbar>div{height:100%;background:linear-gradient(90deg,var(--gold),#ffde59)}
.lvlxp{font-size:12px;color:var(--gray);font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.statg{border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.statg .v{font-size:24px;font-weight:900}
.statg .l{font-size:12px;color:var(--gray);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
/* ---------- league ---------- */
.lghead{text-align:center;padding:20px 0 6px}
.lghead .t{width:38px;height:38px;margin:0 auto;color:var(--gold)}
.lghead h2{font-weight:900;font-size:20px}
.lgrow{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-weight:800;background:#fff}
.lgrow .rk{width:26px;color:var(--gray)}
.lgrow .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);flex:none}
.lgrow .xp{margin-left:auto;color:var(--gold)}
.lgrow.me{border-color:var(--blue);background:#ddf4ff}
.pbar{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin:4px 0 18px}
.pbar>div{height:100%;background:var(--green)}
/* ---------- toasts ---------- */
#toasts{position:fixed;top:70px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px}
#storage-warning{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:250;width:min(560px,calc(100% - 24px));padding:12px 16px;border:2px solid var(--gold);border-radius:12px;background:#fff7d6;color:#5c4300;font-weight:800;text-align:center}
.toast{background:#fff;border:2px solid var(--gold);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.15);animation:slidein .3s ease;font-size:14px}
.toast .ti{width:28px;height:28px}
.toast small{display:block;color:var(--gray);font-weight:700}
@keyframes slidein{from{transform:translateX(120%)}to{transform:translateX(0)}}
.center{text-align:center;padding:40px 0;color:var(--gray);font-weight:800}
/* ---------- polish ---------- */
.unit{box-shadow:0 4px 0 var(--line)}
.unit-head{background-image:linear-gradient(135deg,rgba(255,255,255,.22),transparent 60%)}
.node.open{box-shadow:0 6px 0 rgba(0,0,0,.16),0 0 0 6px color-mix(in srgb,var(--uc) 22%,transparent)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.opt:hover{transform:translateY(-1px)}
.sheet{box-shadow:0 20px 60px rgba(0,0,0,.25)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- welcome + device modes ---------- */
#welcome{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,#58cc02,#1cb0f6);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.wcard{background:#fff;border-radius:26px;max-width:460px;width:100%;padding:30px 24px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:up .3s ease}
.wcard .wowl{display:inline-block;color:var(--green);animation:bounce 1.8s infinite}
.wcard h1{font-size:34px;font-weight:900;color:var(--green);letter-spacing:-1px}
.wcard p{color:var(--gray);font-weight:800;margin:4px 0 18px}
.wcard h2{font-size:19px;font-weight:900;margin-bottom:12px}
.devrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.devbtn{position:relative;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:#fff;padding:20px 8px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);transition:transform .08s,border-color .15s,background .15s}
.devbtn:hover{border-color:var(--blue);background:#ddf4ff}
.devbtn:active{transform:translateY(3px);border-bottom-width:2px}
.devbtn b{font-size:18px;font-weight:900}
.devbtn small{font-size:12px;color:var(--gray);font-weight:700;line-height:1.3}
.devbtn em{position:absolute;top:-10px;background:var(--gold);color:#7a5b00;font-style:normal;font-weight:900;font-size:11px;border-radius:20px;padding:2px 10px;letter-spacing:.5px}
.wcard .whint{font-size:12.5px;margin:16px 0 0}
.kbhint{font-size:12px;color:var(--gray);font-weight:800;text-align:center;margin-bottom:8px}
body.dev-pc .wrap{max-width:680px}
body.dev-mobile{font-size:17px;padding-bottom:calc(66px + env(safe-area-inset-bottom));touch-action:manipulation}
body.dev-mobile.in-lesson{padding-bottom:0}
body.dev-mobile .wrap{max-width:100%;padding:0 14px}
body.dev-mobile .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:none;border-top:2px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 14px rgba(0,0,0,.05)}
body.dev-mobile.in-lesson .tabs{display:none}
body.dev-mobile .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-height:58px;padding:9px 2px 6px;border-bottom:none;border-top:4px solid transparent}
body.dev-mobile .tab.active{border-top-color:var(--blue)}
body.dev-mobile .tab .icon{width:24px;height:24px}
body.dev-mobile .topbar{padding-top:env(safe-area-inset-top)}
body.dev-mobile .node{width:84px;height:84px}
body.dev-mobile .node-label{font-size:13px}
body.dev-mobile .opt{padding:17px 16px;min-height:58px;font-size:16px}
body.dev-mobile .btn{min-height:52px}
body.dev-mobile .prompt{font-size:19px}
body.dev-mobile textarea.editor{font-size:16px;min-height:170px}
body.dev-mobile .code{font-size:13px;padding:14px}
body.dev-mobile .lesson-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
body.dev-mobile .overlay{align-items:flex-end;padding:0}
body.dev-mobile .sheet{max-width:100%;border-radius:24px 24px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.dev-mobile #toasts{left:12px;right:12px;top:calc(66px + env(safe-area-inset-top))}
body.dev-mobile .achgrid{gap:10px}
body.dev-mobile #storage-warning{bottom:76px}
@media(hover:none){.opt:hover{transform:none;border-color:var(--line)}.btn:hover:not(:disabled){filter:none}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap tb-in">
  <div class="brand"><span class="owl" aria-hidden="true"></span>devlingo</div>
  <div class="stats">
    <span class="stat fire" id="st-streak"></span>
    <span class="stat" id="st-xp"></span>
    <span class="stat hp" id="st-hp"></span>
  </div>
</div></header>
<nav class="tabs"><div class="wrap tabs-in">
  <button class="tab active" data-v="learn" onclick="App.tab('learn')"><span class="icon-home"></span> Learn</button>
  <button class="tab" data-v="league" onclick="App.tab('league')"><span class="icon-trophy"></span> League</button>
  <button class="tab" data-v="ach" onclick="App.tab('ach')"><span class="icon-award"></span> Badges</button>
  <button class="tab" data-v="me" onclick="App.tab('me')"><span class="icon-user"></span> Profile</button>
</div></nav>
<main id="view" class="wrap"></main>
<div id="overlay"></div>
<div id="toasts"></div>
<div id="storage-warning" role="status" hidden></div>
<script>
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ICONS={
 owl:'<path d="M4 10a8 8 0 0 0 16 0V8a8 8 0 0 0-16 0v2Z"/><path d="M4 8 2 3l6 2M20 8l2-5-6 2"/><circle cx="9" cy="10" r="2"/><circle cx="15" cy="10" r="2"/><path d="m12 13-1.5 2h3L12 13ZM9 20v2m6-2v2"/>',
 flame:'<path d="M12 22c4.4 0 7-3 7-7 0-3.1-1.8-5.3-4.1-8.1-.2 2.1-1 3.2-2.1 3.8C12.8 7.1 10.5 3.8 7 2c.5 4.1-.4 6.1-2 8.5C3.9 12.2 3 13.8 3 15c0 4 3.2 7 9 7Z"/><path d="M12 22c2 0 3-1.5 3-3.2 0-1.3-.8-2.3-2-3.8-.1 1.1-.6 1.7-1.3 2-.1-1.3-.8-2.5-2-3.4.1 2.2-1.3 3.1-1.3 5.1 0 1.8 1.3 3.3 3.6 3.3Z"/>',

/* ---------- code runner (really executes the code, with a fake clock) ---------- */
async function runCode(code,test){
 const logs=[];let err=null,tid=0,now=0;const timers=new Map();
 const fmt=v=>{if(typeof v==="string")return v;if(v===undefined)return"undefined";if(typeof v==="function")return"[Function]";try{return JSON.stringify(v)}catch(e){return String(v)}};
 const log=(...a)=>{logs.push(a.map(fmt).join(" "))};
 const con={log:log,error:log,info:log,warn:log};
 const st=(fn,ms,...a)=>{const id=++tid;timers.set(id,{fn:fn,a:a,id:id,at:now+(+ms||0),int:0});return id};
 const si=(fn,ms,...a)=>{const id=++tid;ms=Math.max(+ms||0,1);timers.set(id,{fn:fn,a:a,id:id,at:now+ms,int:ms});return id};
 const ct=id=>{timers.delete(id)};
 const ffetch=()=>Promise.resolve({ok:true,status:200,json:async()=>({ok:true}),text:async()=>"",headers:{get:()=>null}});
 const tick=()=>new Promise(r=>setTimeout(r,0));
 const AsyncFn=Object.getPrototypeOf(async function(){}).constructor;
 try{
  const fn=new AsyncFn("console","setTimeout","setInterval","clearTimeout","clearInterval","fetch",code+"\n;"+test);
  await fn(con,st,si,ct,ct,ffetch);
 }catch(e){err=e&&e.message?e.message:String(e)}
 for(let i=0;i<5;i++)await tick();
 let guard=0;
 while(timers.size&&guard++<200){
  let n=null;timers.forEach(t=>{if(!n||t.at<n.at||(t.at===n.at&&t.id<n.id))n=t});
  if(n.at>2000)break;
  now=n.at;if(n.int)n.at=now+n.int;else timers.delete(n.id);
  try{const r=n.fn(...n.a);if(r&&r.then)r.catch(()=>{})}catch(e){err=err||e.message}
  for(let j=0;j<3;j++)await tick();
 }
 return {logs:logs,err:err};
}
