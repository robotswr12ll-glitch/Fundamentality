function countDone(){let n=0;for(const k in S.lessons)if(S.lessons[k].done)n++;return n}
function unitDone(ui){return CUR[ui].lessons.every(l=>S.lessons[l.id]&&S.lessons[l.id].done)}
function isUnlocked(ui,li){return true}
function isNext(ui,li){for(let a=0;a<CUR.length;a++)for(let b=0;b<CUR[a].lessons.length;b++)if(!(S.lessons[CUR[a].lessons[b].id]||{}).done)return a===ui&&b===li;return false}
function levelOf(xp){return Math.floor(xp/100)+1}

function updateHeader(){$("#st-hp").innerHTML=iconHeart()+" "+hpNow;$("#st-streak").innerHTML=icon("flame",17)+" "+S.streak;$("#st-xp").innerHTML=icon("star",17)+" "+S.xp}
/* ================= VIEWS ================= */
const App={currentTab:"learn",
 tab(v){Sfx.click();this.currentTab=v;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.v===v));this.render()},
 render(){hpNow=5;updateHeader();document.body.classList.remove("in-lesson");if(this.currentTab==="learn")renderLearn();else if(this.currentTab==="league")renderLeague();else if(this.currentTab==="ach")renderAch();else renderMe();window.scrollTo(0,0)},
 open(u,l){const L=CUR[u].lessons[l];if(!isUnlocked(u,l))return;Sfx.click();
  sheet(`<span class="mascot">${icon("owl",58)}</span>
   <div class="un">${CUR[u].title} · Lesson ${l+1}</div>
   <h2>${L.title}</h2>
   <div class="tipbox"><b>${icon("sparkles",16)} Coach Bit says:</b> ${L.tip}</div>
   <div class="meta">${L.exs.length} exercises · up to ${L.exs.length*10+20} XP</div>
   <button class="btn btn-green btn-big" onclick="App.start(${u},${l})">Start Lesson</button>
   <button class="btn btn-ghost" style="margin-top:10px" onclick="closeSheet()">Maybe later</button>`)},
 start(u,l){closeSheet();Sfx.click();
  this.L={u:u,l:l,d:shuffled(CUR[u].lessons[l]),i:0,hearts:5,xp:0,wrong:0,sel:null,answered:false,attempts:0,correct:0};
  function shuffled(lesson){
  return {...lesson,exs:lesson.exs.map(ex=>{
    if(!ex.o)return ex;
    const idx=ex.o.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
    return {...ex,o:idx.map(i=>ex.o[i]),a:idx.indexOf(ex.a)};
  })};
}
  this.renderLesson()},
 /* ---------- lesson rendering ---------- */
 renderLesson(){const L=this.L,ex=L.d.exs[L.i];hpNow=L.hearts;updateHeader();document.body.classList.add("in-lesson");
  const typeName={quiz:"Multiple Choice",out:"Predict the Output",fill:"Fill the Blank",bug:"Find the Bug",code:"Write Code"}[ex.t];
  const pct=Math.round((L.i)/L.d.exs.length*100);
  let body="";
  if(ex.t==="quiz"){body=`<div class="prompt">${esc(ex.q)}</div><div class="opts">${ex.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="App.pick(${i})"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`}
  else if(ex.t==="out"){body=`<div class="prompt">${esc(ex.q)}</div><div class="code">${esc(ex.c)}</div><div class="opts">${ex.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="App.pick(${i})"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`}
  else if(ex.t==="fill"){body=`<div class="prompt">${ex.p}</div><div class="code">${esc(ex.c).replace("____",'<span class="blank">&nbsp;?&nbsp;</span>')}</div><div class="opts">${ex.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="App.pick(${i})"><span class="k">${i+1}</span><span><code>${esc(o)}</code></span></button>`).join("")}</div>`}
  else if(ex.t==="bug"){const lines=ex.c.split("\n");body=`<div class="prompt">${esc(ex.q)}</div><div class="code">${lines.map((ln,i)=>`<span class="ln">${i+1}</span>${esc(ln)}\n`).join("")}</div><div class="opts">${ex.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="App.pick(${i})"><span class="k">${i+1}</span><span><code>${esc(o)}</code></span></button>`).join("")}</div>`}
  else if(ex.t==="code"){body=`<div class="prompt">${ex.p}</div><textarea class="editor" id="editor" spellcheck="false">${esc(ex.s||"")}</textarea><div id="runpanel"></div>`}
  $("#view").innerHTML=`
   <div class="lesson-top">
     <button class="xbtn" aria-label="Quit lesson" onclick="App.quit()">${icon("close",20)}</button>
     <div class="ptrack"><div class="pfill" style="width:${pct}%"></div></div>
     <span class="lhearts" id="lhearts">${iconHeart()} ${L.hearts}</span>
   </div>
   <div class="extype">${icon(ex.t==="code"?"code":"book",18)} ${typeName} <span style="margin-left:auto;color:var(--gray)">${L.i+1} / ${L.d.exs.length}</span></div>
   <div class="excard" id="excard">${body}</div>
   <div class="lesson-foot">
     <div class="feedback" id="fb"></div>
     ${S.device==="pc"?`<div class="kbhint">${ex.t==="code"?"Ctrl+Enter to run":"Press 1–"+ex.o.length+" to choose · Enter to check / continue"}</div>`:""}
     <div class="rowbtns" style="display:flex;gap:10px">
       <button class="btn ${ex.t==="code"?"btn-blue":"btn-green"} btn-big" id="checkbtn" ${ex.t==="code"?"":"disabled"} onclick="App.check()">${ex.t==="code"?"Run & Check":"Check"}</button>
     </div>
   </div>`;
  if(ex.t==="code"){const ed=$("#editor");
   ed.addEventListener("input",()=>{if(!L.answered)$("#checkbtn").disabled=false});
   ed.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();ed.setRangeText("  ",ed.selectionStart,ed.selectionEnd,"end")}});
   if(S.device!=="mobile"){ed.focus();ed.setSelectionRange(ed.value.length,ed.value.length)}}
 },
 pick(i){const L=this.L;if(L.answered)return;Sfx.click();L.sel=i;document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.i===i));$("#checkbtn").disabled=false},
 async check(){const L=this.L,ex=L.d.exs[L.i];
  if(L.answered)return;
  if(ex.t==="code"){
   const code=$("#editor").value;
   $("#checkbtn").disabled=true;$("#checkbtn").textContent="Running…";
   const res=await runCode(code,ex.tc||"");
   L.attempts++;
   let ok=false;
   if(!res.err){
    if(ex.tc)ok=res.logs[res.logs.length-1]==="PASS";
    else ok=JSON.stringify(res.logs)===JSON.stringify(ex.r);
   }
   const rp=$("#runpanel");
   if(res.err)rp.innerHTML=`<div class="runout err">Error: ${esc(res.err)}</div>`;
   else rp.innerHTML=`<div class="runout okl">${icon("code",16)} Your output:\n${esc(res.logs.join("\n")||"(nothing logged)")}</div>`;
   const btn=$("#checkbtn");btn.disabled=false;
   if(ok){this.judge(true)}
   else if(L.attempts<2){btn.textContent="Try Again";this.fb(false,"Not quite — check the output above.",esc(ex.e)+"<br><br>"+icon("sparkles",16)+" Tip: one more try, then I'll show you the answer.",false)}
   else{L.answered=true;L.wrong++;L.hearts--;Sfx.no();this.fb(false,"Here's a working solution:",`<div class="code" style="text-align:left">${esc(ex.sol)}</div><br>${esc(ex.e)}`,false);this.afterAnswer(false)}
   return;
  }
  if(L.sel==null)return;
  this.judge(L.sel===ex.a);
 },
 judge(ok){const L=this.L,ex=L.d.exs[L.i];L.answered=true;
  document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;if(i===ex.a)b.classList.add("right");else if(i===L.sel&&!ok)b.classList.add("wrong")});
  const btn=$("#checkbtn");btn.className="btn "+(ok?"btn-green":"btn-red")+" btn-big";btn.disabled=false;btn.textContent="Continue";btn.onclick=()=>App.next();
  this.fb(ok,ok?"Nice! "+icon("check",16):"Correct answer: <b>"+esc(ex.o?ex.o[ex.a]:"")+"</b>",esc(ex.e),true);
  if(ok){L.xp+=10;L.correct++;Sfx.ok();if(ex.t==="code"){S.codeSolved++;save()}}
  else{L.hearts--;L.wrong++;Sfx.no()}
  this.afterAnswer(ok);
 },
 fb(good,title,html,auto){const f=$("#fb");f.className="feedback show "+(good?"good":"bad");f.innerHTML=`<h3>${title}</h3><p>${html}</p>`;if(!auto){const btn=$("#checkbtn");btn.className="btn btn-blue btn-big";btn.textContent="Try Again";btn.onclick=()=>{f.className="feedback";btn.className="btn btn-blue btn-big";btn.textContent="Run & Check";btn.onclick=()=>App.check()};if(L0().attempts>=2&&L0().answered){btn.textContent="Continue";btn.className="btn btn-red btn-big";btn.onclick=()=>App.next()}}
  f.scrollIntoView({block:"nearest",behavior:"smooth"})},
 afterAnswer(ok){const L=this.L;hpNow=L.hearts;updateHeader();const h=$("#lhearts");if(h)h.innerHTML=iconHeart()+" "+L.hearts;
  const pf=document.querySelector(".pfill");if(pf)pf.style.width=Math.round((L.i+1)/L.d.exs.length*100)+"%"},
 next(){const L=this.L;
  if(L.hearts<=0){this.renderFail();return}
  if(L.i>=L.d.exs.length-1){this.finish();return}
  L.i++;L.sel=null;L.answered=false;L.attempts=0;Sfx.click();this.renderLesson()},
 quit(){Sfx.click();hpNow=5;updateHeader();document.body.classList.remove("in-lesson");this.currentTab="learn";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.v==="learn"));renderLearn()},
 finish(){const L=this.L;const perfect=L.wrong===0;if(perfect)L.xp+=20;
  const key=L.d.id,prev=S.lessons[key]||{};
  S.lessons[key]={done:true,perfect:prev.perfect||perfect};
  bumpStreak();S.xp+=L.xp;S.today.xp+=L.xp;if(perfect)S.perfects=(S.perfects||0)+1;
  save();checkAch();updateHeader();Sfx.win();
  const all=unitDone(L.u)?`<div class="flaw">${icon("award",18)} Unit complete: ${CUR[L.u].title}!</div>`:"";
  $("#view").innerHTML=`<div class="endcard">
    <span class="bigowl">${icon("owl",76)}</span>
    <h2>Lesson complete!</h2>
    <div class="sub">${L.d.title}</div>
    ${perfect?`<div class="flaw">${icon("sparkles",18)} FLAWLESS — no mistakes!</div>`:""}
    ${all}
    <div class="xpbar">${icon("bolt",20)} +${L.xp} XP</div>
    <div class="rows">
      <div class="row"><span>Exercises correct</span><span>${L.correct} / ${L.d.exs.length}</span></div>
      <div class="row"><span>Hearts left</span><span>${L.hearts>0?iconHeart(16)+" "+L.hearts:"None"}</span></div>
      <div class="row"><span>Total XP</span><span>${icon("star",16)} ${S.xp}</span></div>
    </div>
    <button class="btn btn-green btn-big" onclick="App.quit()">Continue</button>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="App.start(${L.u},${L.l})">Practice again</button>
  </div>`;window.scrollTo(0,0)},
 renderFail(){Sfx.no();const L=this.L;
  $("#view").innerHTML=`<div class="endcard">
    <span class="bigowl">${icon("heart",76)}</span>
    <h2>Out of hearts!</h2>
    <div class="sub">Don't worry — even senior devs Google 'how to exit vim'. Try again!</div>

    <button class="btn btn-ghost" style="margin-top:10px" onclick="App.quit()">Back to tree</button>
  </div>`;window.scrollTo(0,0)}
};

 $("#view").innerHTML=`
